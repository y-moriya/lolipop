<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /workspace/public_html

    <Directory /workspace/public_html>
        # CGIの実行を許可し、シンボリックリンクの追従などを有効にする
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        # .htaccess による設定上書きを許可
        AllowOverride All
        # アクセス許可
        Require all granted
        
        # .rb と .cgi をCGIスクリプトとして処理する
        AddHandler cgi-script .rb .cgi
    </Directory>

    # ログ設定
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
